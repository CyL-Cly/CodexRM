name: Bug 报告
description: 报告可复现的功能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。安全问题请使用 Security 私密报告，不要在此披露。
        提交前移除令牌、API Key、注册密钥、配对码、私人路径和会话正文。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际结果是什么？预期结果是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CodexRM 版本或提交
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、Go/Node.js、Codex 客户端版本及部署方式。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 只粘贴相关片段，不要上传真实凭据或私人对话。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 已搜索已有 Issue，并移除了日志中的敏感信息
          required: true
