name: 功能建议
description: 建议一项新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景和当前限制，而不只是期望的实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望的交互或行为是什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现或现有替代方式？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附脱敏截图、示意图或相关链接。
