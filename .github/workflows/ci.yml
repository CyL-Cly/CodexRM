name: Nightly

on:
  schedule:
    # 00:23 the following day in Asia/Singapore.
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-commit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the latest main commit for the build date
        id: select
        env:
          # POSIX TZ syntax: Singapore is UTC+8 year-round.
          TZ: SGT-8
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            day=$(date --date=yesterday +%F)
          else
            day=$(date +%F)
          fi
          start=$(date --date="$day 00:00:00 +0800" +%s)
          end=$((start + 86400))
          sha=$(git log --first-parent --format='%ct %H' | awk -v start="$start" -v end="$end" '$1 >= start && $1 < end && !found { print $2; found = 1 }')
          if [[ -z "$sha" ]]; then
            echo "No commits on the default branch for $day (Asia/Singapore)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="nightly-$day-${sha:0:12}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Nightly $tag already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'sha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $expectedHash = '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup download failed the SHA-256 check.'
          }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR="' + $installDir + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          $compiler = Join-Path $installDir 'ISCC.exe'
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup installation failed (exit code $($process.ExitCode))."
          }
          "INNO_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Package Windows offline installer and server
        shell: pwsh
        run: |
          & ./build/scripts/build.ps1 -Target All
          & ./build/scripts/package-setup.ps1 -OutputPath "nightly-dist/CodexRM-$env:TAG-windows-amd64-Setup.exe"

          $serverDir = Join-Path $env:RUNNER_TEMP 'codexrm-windows-server-amd64'
          New-Item -ItemType Directory -Path $serverDir | Out-Null
          Copy-Item -LiteralPath './build/bin/codexrm-server.exe', './LICENSE' -Destination $serverDir
          Copy-Item -LiteralPath './web' -Destination $serverDir -Recurse
          Remove-Item -LiteralPath (Join-Path $serverDir 'web/app.test.mjs'), (Join-Path $serverDir 'web/sw.test.mjs')
          Compress-Archive -Path (Join-Path $serverDir '*') -DestinationPath "nightly-dist/CodexRM-$env:TAG-windows-amd64-server.zip"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-windows
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux-android:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Package Linux amd64
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
          GOOS: linux
        run: |
          out="$PWD/nightly-dist"
          linux="$RUNNER_TEMP/codexrm-linux-amd64"
          mkdir -p "$out" "$linux"
          go build -trimpath -ldflags "-s -w" -o "$linux/codexrm-agent" ./cmd/codexrm-agent
          go build -trimpath -ldflags "-s -w" -o "$linux/codexrm-server" ./cmd/codexrm-server
          git archive HEAD web | tar -x -C "$linux"
          rm -f "$linux/web/app.test.mjs" "$linux/web/sw.test.mjs"
          cp LICENSE "$linux/"
          tar -czf "$out/CodexRM-$TAG-linux-amd64.tar.gz" -C "$linux" .

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4.0.4

      - name: Package Android arm64
        run: |
          # Read SDK pins from the selected source commit.
          sdk=$(awk '$1 == "compileSdk" && $2 == "=" {print $3}' android/app/build.gradle.kts)
          ndk=$(awk -F '"' '/^[[:space:]]*ndkVersion[[:space:]]*=/ {print $2}' android/app/build.gradle.kts)
          sdkmanager --install "platforms;android-$sdk" "ndk;$ndk"
          (cd android && bash gradlew --no-daemon :app:assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "nightly-dist/CodexRM-$TAG-android-arm64-debug.apk"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-linux-android
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [select-commit, build-windows, build-linux-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.select-commit.outputs.tag }}
      SOURCE_SHA: ${{ needs.select-commit.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ env.TAG }}-*
          merge-multiple: true
          path: nightly-dist/

      - name: Publish GitHub prerelease
        working-directory: nightly-dist
        run: |
          assets=(
            "CodexRM-$TAG-windows-amd64-Setup.exe"
            "CodexRM-$TAG-windows-amd64-server.zip"
            "CodexRM-$TAG-linux-amd64.tar.gz"
            "CodexRM-$TAG-android-arm64-debug.apk"
          )
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          if existing=$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv'); then
            read -r draft target <<< "$existing"
            if [[ "$draft" != true ]]; then
              echo "Nightly $TAG is already published."
              exit 0
            fi
            [[ "$target" == "$SOURCE_SHA" ]]
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release create "$TAG" "${assets[@]}" --target "$SOURCE_SHA" --title "$TAG" \
              --prerelease --latest=false --notes "Build from commit $SOURCE_SHA. The Windows Agent setup includes the files needed for offline installation. The Android APK is debug-signed by the runner."
          fi
