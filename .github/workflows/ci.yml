name: Nightly

on:
  schedule:
    # 00:23 the following day in Asia/Singapore.
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-commit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the latest main commit for the build date
        id: select
        env:
          # POSIX TZ syntax: Singapore is UTC+8 year-round.
          TZ: SGT-8
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            day=$(date --date=yesterday +%F)
          else
            day=$(date +%F)
          fi
          start=$(date --date="$day 00:00:00 +0800" +%s)
          end=$((start + 86400))
          sha=$(git log --first-parent --format='%ct %H' | awk -v start="$start" -v end="$end" '$1 >= start && $1 < end && !found { print $2; found = 1 }')
          if [[ -z "$sha" ]]; then
            echo "No commits on the default branch for $day (Asia/Singapore)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="nightly-$day-${sha:0:12}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Nightly $tag already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'sha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $expectedHash = '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup download failed the SHA-256 check.'
          }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR="' + $installDir + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          $compiler = Join-Path $installDir 'ISCC.exe'
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup installation failed (exit code $($process.ExitCode))."
          }
          "INNO_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Package Windows Agent offline installer
        shell: pwsh
        run: |
          & ./build/scripts/build.ps1 -Target Agent
          & ./build/scripts/package-setup.ps1 -OutputPath "nightly-dist/CodexRM-$env:TAG-windows-amd64-Setup.exe"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-windows
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux-android:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Package Linux Agents for amd64 and arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          out="$PWD/nightly-dist"
          mkdir -p "$out"
          for arch in amd64 arm64; do
            agent="$RUNNER_TEMP/codexrm-linux-$arch-agent"
            mkdir -p "$agent"
            GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$agent/codexrm-agent" ./cmd/codexrm-agent
            cp LICENSE "$agent/"
            tar -czf "$out/CodexRM-$TAG-linux-$arch-agent.tar.gz" -C "$agent" .
          done

      - name: Package Linux amd64 Server
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          server="$RUNNER_TEMP/codexrm-linux-amd64-server"
          mkdir -p "$server"
          go build -trimpath -ldflags "-s -w" -o "$server/codexrm-server" ./cmd/codexrm-server
          git archive HEAD web | tar -x -C "$server"
          rm -f "$server/web/app.test.mjs" "$server/web/sw.test.mjs"
          cp LICENSE "$server/"
          install -m 0755 build/scripts/install-server.sh "$server/install-server.sh"
          install -d "$server/deploy"
          install -m 0644 deploy/codexrm.service deploy/nginx-location.conf "$server/deploy/"
          tar -czf "nightly-dist/CodexRM-$TAG-linux-amd64-server.tar.gz" -C "$server" .

      - name: Check Android signing configuration
        id: android-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" && -z "$KEYSTORE_PASSWORD" ]]; then
            echo '::warning::Android signing secrets are not configured. No APK will be uploaded.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          elif [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::Configure both Android signing secrets, or remove both to skip Android.'
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6.3.0
        if: steps.android-signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4.0.4
        if: steps.android-signing.outputs.enabled == 'true'

      - name: Build Android arm64-v8a Release
        if: steps.android-signing.outputs.enabled == 'true'
        run: |
          # Android 17 and newer SDK packages use major.minor IDs.
          sdk=$(awk '$1 == "compileSdk" && $2 == "=" {print $3}' android/app/build.gradle.kts)
          ndk=$(awk -F '"' '/^[[:space:]]*ndkVersion[[:space:]]*=/ {print $2}' android/app/build.gradle.kts)
          [[ "$sdk" =~ ^[0-9]+$ && "$ndk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if (( sdk >= 37 )); then sdk="$sdk.0"; fi
          sdkmanager --install "platforms;android-$sdk" "ndk;$ndk" "build-tools;36.0.0"
          (cd android && bash gradlew --no-daemon :app:assembleRelease)

      - name: Sign and verify Android Release APK
        if: steps.android-signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          # Public certificate fingerprint from the already distributed CodexRM APK.
          EXPECTED_SIGNER: a8b22ad8ba654a4b511c3464181913126ac92206ce88887e0fada7fcd481be61
        run: |
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/codexrm-android-signing.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$scratch/release.keystore"
          unset KEYSTORE_BASE64
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk="CodexRM-$TAG-android-arm64-v8a-release.apk"
          "$apksigner" sign --ks "$scratch/release.keystore" --ks-key-alias androiddebugkey \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$scratch/$apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          unset KEYSTORE_PASSWORD
          certificates=$("$apksigner" verify --print-certs "$scratch/$apk")
          actual=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print $NF}' <<< "$certificates")
          if [[ "$actual" != "$EXPECTED_SIGNER" ]]; then
            echo '::error::APK signing certificate does not match existing CodexRM installations.'
            exit 1
          fi
          mv -- "$scratch/$apk" "nightly-dist/$apk"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-linux-android
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [select-commit, build-windows, build-linux-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.select-commit.outputs.tag }}
      SOURCE_SHA: ${{ needs.select-commit.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ env.TAG }}-*
          merge-multiple: true
          path: nightly-dist/

      - name: Publish GitHub prerelease
        working-directory: nightly-dist
        run: |
          assets=(
            "CodexRM-$TAG-windows-amd64-Setup.exe"
            "CodexRM-$TAG-linux-amd64-agent.tar.gz"
            "CodexRM-$TAG-linux-arm64-agent.tar.gz"
            "CodexRM-$TAG-linux-amd64-server.tar.gz"
          )
          apk="CodexRM-$TAG-android-arm64-v8a-release.apk"
          android_note='Android APK omitted: release signing is not configured.'
          if [[ -f "$apk" ]]; then
            assets+=("$apk")
            android_note='The Android arm64-v8a APK is signed and can be installed directly.'
          fi
          notes="Build from commit $SOURCE_SHA. The Windows Agent setup includes the files needed for offline installation. $android_note"
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          if existing=$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv'); then
            read -r draft target <<< "$existing"
            if [[ "$draft" != true ]]; then
              echo "Nightly $TAG is already published."
              exit 0
            fi
            [[ "$target" == "$SOURCE_SHA" ]]
            gh release upload "$TAG" "${assets[@]}" --clobber
            legacy_apk="CodexRM-$TAG-android-arm64-v8a-release-unsigned.apk"
            old_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            if grep -Fxq "$legacy_apk" <<< "$old_assets"; then
              gh release delete-asset "$TAG" "$legacy_apk" --yes
            fi
            gh release edit "$TAG" --draft=false --prerelease --latest=false --notes "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --target "$SOURCE_SHA" --title "$TAG" \
              --prerelease --latest=false --notes "$notes"
          fi
