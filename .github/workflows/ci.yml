name: Nightly

on:
  schedule:
    # 00:23 the following day in Asia/Singapore.
    - cron: '23 16 * * *'
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and verify bundles without publishing any release
        type: boolean
        default: false
      include_android:
        description: Build a signed Android installer using the protected signing environment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-commit:
    if: github.repository == 'CyL-Cly/CodexRM' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the latest main commit for the build date
        id: select
        env:
          # POSIX TZ syntax: Singapore is UTC+8 year-round.
          TZ: SGT-8
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            day=$(date --date=yesterday +%F)
            start=$(date --date="$day 00:00:00 +0800" +%s)
            end=$((start + 86400))
            sha=$(git log --first-parent --format='%ct %H' | awk -v start="$start" -v end="$end" '$1 >= start && $1 < end && !found { print $2; found = 1 }')
          else
            day=$(date +%F)
            sha=$(git rev-parse HEAD)
          fi
          if [[ -z "$sha" ]]; then
            echo "No commits on the default branch for $day (Asia/Singapore)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="nightly-$day-${sha:0:12}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo "Nightly $tag already exists." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A deleted GitHub Release leaves its tag behind. Allow manual rebuilds
            # without moving that tag or replacing an already published release.
            [[ $(git rev-parse "refs/tags/$tag^{commit}") == "$sha" ]]
          fi
          printf 'sha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Verify central release scripts
        shell: pwsh
        run: |
          go test -mod=readonly ./...
          if ($LASTEXITCODE) { throw 'Go tests failed.' }
          powershell -NoProfile -File ./build/scripts/test-release.ps1
          if ($LASTEXITCODE) { throw 'Windows release script tests failed.' }
          powershell -NoProfile -File ./build/scripts/test-release-android.ps1
          if ($LASTEXITCODE) { throw 'Android release script tests failed.' }

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $expectedHash = '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup download failed the SHA-256 check.'
          }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR="' + $installDir + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          $compiler = Join-Path $installDir 'ISCC.exe'
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup installation failed (exit code $($process.ExitCode))."
          }
          "INNO_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Package Windows Agent offline installer
        shell: pwsh
        env:
          CODEXRM_RELEASE_UPDATE_BASE: ${{ inputs.build_only && 'https://updates.example.invalid' || secrets.CODEXRM_RELEASE_UPDATE_BASE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODEXRM_RELEASE_UPDATE_BASE)) { throw 'Release update origin is not configured.' }
          & ./build/scripts/build.ps1 -Target Agent
          . ./build/scripts/release-update-flags.ps1
          Assert-ReleaseOriginEmbedded (Join-Path $PWD 'build/bin/codexrm-agent.exe')
          & ./build/scripts/package-setup.ps1 -OutputPath "nightly-dist/CodexRM-$env:TAG-windows-amd64-Setup.exe"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-windows
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
      SOURCE_SHA: ${{ needs.select-commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Package Linux Agent and Server from pinned modules
        shell: pwsh
        env:
          CODEXRM_RELEASE_UPDATE_BASE: ${{ inputs.build_only && 'https://updates.example.invalid' || secrets.CODEXRM_RELEASE_UPDATE_BASE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODEXRM_RELEASE_UPDATE_BASE)) { throw 'Release update origin is not configured.' }
          . ./build/scripts/component-sources.ps1
          . ./build/scripts/release-update-flags.ps1
          $agentSource = Get-CodexRMComponentDir Agent
          $out = Join-Path $PWD 'nightly-dist'
          [void][IO.Directory]::CreateDirectory($out)
          foreach ($arch in @('amd64', 'arm64')) {
            & ./build/scripts/build.ps1 -Linux -Target Agent -Arch $arch
            $binary = Join-Path $PWD "build/bin/codexrm-agent-linux-$arch"
            Assert-ReleaseOriginEmbedded $binary
            $stage = Join-Path $env:RUNNER_TEMP "codexrm-linux-$arch-agent"
            [void][IO.Directory]::CreateDirectory($stage)
            Copy-Item -LiteralPath $binary -Destination (Join-Path $stage 'codexrm-agent')
            chmod 0755 (Join-Path $stage 'codexrm-agent')
            if ($LASTEXITCODE) { throw "Could not mark the $arch Agent executable." }
            Copy-Item -LiteralPath (Join-Path $agentSource 'LICENSE') -Destination $stage
            tar -czf (Join-Path $out "CodexRM-$env:TAG-linux-$arch-agent.tar.gz") -C $stage .
            if ($LASTEXITCODE) { throw "Could not package $arch Agent." }
          }
          & ./build/scripts/release-server.ps1 -InstallerOutput (Join-Path $out "CodexRM-$env:TAG-linux-amd64-server.tar.gz")
          $pins = Invoke-CodexRMGo list -mod=readonly -m -f '{{.Path}} {{.Version}}' $script:CodexRMComponentModules.Agent $script:CodexRMComponentModules.Server
          if ($LASTEXITCODE) { throw 'Could not record the pinned source versions.' }
          @("$env:GITHUB_REPOSITORY $env:SOURCE_SHA") + $pins | Set-Content -Encoding utf8NoBOM (Join-Path $out 'SOURCES.txt')

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-linux
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-android:
    needs: select-commit
    if: github.event_name == 'workflow_dispatch' && inputs.include_android && needs.select-commit.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-release-signing
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4.0.4

      - name: Test and build the Android ARM64 installer
        shell: bash
        env:
          CODEXRM_RELEASE_UPDATE_BASE: ${{ secrets.CODEXRM_RELEASE_UPDATE_BASE }}
        run: |
          if [[ -z "$CODEXRM_RELEASE_UPDATE_BASE" ]]; then
            echo '::error::CODEXRM_RELEASE_UPDATE_BASE is required to build the Android installer.'
            exit 1
          fi
          sdk=$(awk '$1 == "compileSdk" && $2 == "=" {print $3}' android/app/build.gradle.kts)
          ndk=$(awk -F '"' '/^[[:space:]]*ndkVersion[[:space:]]*=/ {print $2}' android/app/build.gradle.kts)
          [[ "$sdk" =~ ^[0-9]+$ && "$ndk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          platform="android-$sdk"
          if (( sdk >= 37 )); then platform+='.0'; fi
          sdkmanager --install "platforms;$platform" "ndk;$ndk" 'build-tools;36.0.0'
          cd android
          bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      # Reuse the protected environment and the pinned encrypted signing material.
      - name: Fetch the encrypted Android signing keystore
        uses: actions/checkout@v7.0.1
        with:
          repository: CyL-Cly/CodexRM-signing
          ref: 44ba7d772bc3a65992df3b4cd6ba68016590789d
          ssh-key: ${{ secrets.ANDROID_SIGNING_REPO_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: .ci-android-signing

      - name: Sign and verify the Android installer
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          EXPECTED_SIGNER: a8b22ad8ba654a4b511c3464181913126ac92206ce88887e0fada7fcd481be61
        run: |
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/codexrm-android-signing.XXXXXXXX")
          keystore='.ci-android-signing/android-release.p12'
          trap 'rm -f -- "$keystore"; rm -rf -- "$scratch"' EXIT
          if [[ ! -s "$keystore" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::The encrypted Android keystore or its password is missing.'
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk="CodexRM-$TAG-android-arm64-v8a-release.apk"
          "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias codexrm-release \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "$scratch/$apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          unset KEYSTORE_PASSWORD
          certificates=$("$apksigner" verify --print-certs "$scratch/$apk")
          actual=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print $NF}' <<< "$certificates")
          if [[ "$actual" != "$EXPECTED_SIGNER" ]]; then
            echo '::error::APK signing certificate does not match existing CodexRM installations.'
            exit 1
          fi
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$scratch/$apk")
          grep -q "^package: name='com.codexrm.mobile' " <<< "$badging"
          grep -q "^native-code: 'arm64-v8a'$" <<< "$badging"
          mkdir -p nightly-dist
          mv -- "$scratch/$apk" "nightly-dist/$apk"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-android
          path: nightly-dist/*-android-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: >-
      ${{ !cancelled() && github.repository == 'CyL-Cly/CodexRM' && !inputs.build_only &&
      needs.build-windows.result == 'success' && needs.build-linux.result == 'success' &&
      (!inputs.include_android || needs.build-android.result == 'success') }}
    needs: [select-commit, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.select-commit.outputs.tag }}
      SOURCE_SHA: ${{ needs.select-commit.outputs.sha }}
      INCLUDE_ANDROID: ${{ inputs.include_android }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ env.TAG }}-*
          merge-multiple: true
          path: nightly-dist/

      - name: Publish GitHub prerelease
        working-directory: nightly-dist
        run: |
          assets=(
            "CodexRM-$TAG-windows-amd64-Setup.exe"
            "CodexRM-$TAG-linux-amd64-agent.tar.gz"
            "CodexRM-$TAG-linux-arm64-agent.tar.gz"
            "CodexRM-$TAG-linux-amd64-server.tar.gz"
            "SOURCES.txt"
          )
          if [[ "$INCLUDE_ANDROID" == true ]]; then
            assets+=("CodexRM-$TAG-android-arm64-v8a-release.apk")
          fi
          notes="Manual installation packages from commit $SOURCE_SHA; see SOURCES.txt for the Agent and Server module versions. Update packages and manifests are distributed separately by the update site."
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          if existing=$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv'); then
            read -r draft target <<< "$existing"
            if [[ "$draft" != true ]]; then
              echo "Nightly $TAG is already published."
              exit 0
            fi
            [[ "$target" == "$SOURCE_SHA" ]]
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false --prerelease --latest=false --notes "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --target "$SOURCE_SHA" --title "$TAG" \
              --prerelease --latest=false --notes "$notes"
          fi
