name: Nightly

on:
  schedule:
    # 00:23 the following day in Asia/Singapore.
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-commit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the latest main commit for the build date
        id: select
        env:
          # POSIX TZ syntax: Singapore is UTC+8 year-round.
          TZ: SGT-8
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            day=$(date --date=yesterday +%F)
            start=$(date --date="$day 00:00:00 +0800" +%s)
            end=$((start + 86400))
            sha=$(git log --first-parent --format='%ct %H' | awk -v start="$start" -v end="$end" '$1 >= start && $1 < end && !found { print $2; found = 1 }')
          else
            day=$(date +%F)
            sha=$(git rev-parse HEAD)
          fi
          if [[ -z "$sha" ]]; then
            echo "No commits on the default branch for $day (Asia/Singapore)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="nightly-$day-${sha:0:12}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo "Nightly $tag already exists." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A deleted GitHub Release leaves its tag behind. Allow manual rebuilds
            # without moving that tag or replacing an already published release.
            [[ $(git rev-parse "refs/tags/$tag^{commit}") == "$sha" ]]
          fi
          printf 'sha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $expectedHash = '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup download failed the SHA-256 check.'
          }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR="' + $installDir + '"'
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          $compiler = Join-Path $installDir 'ISCC.exe'
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup installation failed (exit code $($process.ExitCode))."
          }
          "INNO_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Package Windows Agent offline installer
        shell: pwsh
        env:
          CODEXRM_RELEASE_UPDATE_BASE: ${{ secrets.CODEXRM_RELEASE_UPDATE_BASE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODEXRM_RELEASE_UPDATE_BASE)) { throw 'Release update origin is not configured.' }
          & ./build/scripts/build.ps1 -Target Agent
          $origin = $env:CODEXRM_RELEASE_UPDATE_BASE.Trim().TrimEnd('/')
          $binary = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $PWD 'build/bin/codexrm-agent.exe')))
          if (!$binary.Contains($origin)) { throw 'Release update origin is missing from the Windows Agent.' }
          & ./build/scripts/package-setup.ps1 -OutputPath "nightly-dist/CodexRM-$env:TAG-windows-amd64-Setup.exe"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-windows
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux:
    needs: select-commit
    if: needs.select-commit.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: ${{ needs.select-commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select-commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Package Linux Agents for amd64 and arm64
        env:
          CODEXRM_RELEASE_UPDATE_BASE: ${{ secrets.CODEXRM_RELEASE_UPDATE_BASE }}
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          origin=${CODEXRM_RELEASE_UPDATE_BASE%/}
          [[ "$origin" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?$ ]] || { echo '::error::A valid release update origin is required.'; exit 1; }
          out="$PWD/nightly-dist"
          mkdir -p "$out"
          for arch in amd64 arm64; do
            agent="$RUNNER_TEMP/codexrm-linux-$arch-agent"
            mkdir -p "$agent"
            GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/codexrm/codexrm/internal/release.updateBaseURL=$origin" -o "$agent/codexrm-agent" ./cmd/codexrm-agent
            grep -aFq -- "$origin" "$agent/codexrm-agent" || { echo '::error::Release update origin is missing from the Linux Agent.'; exit 1; }
            cp LICENSE "$agent/"
            tar -czf "$out/CodexRM-$TAG-linux-$arch-agent.tar.gz" -C "$agent" .
          done

      - name: Package Linux amd64 Server
        env:
          CODEXRM_RELEASE_UPDATE_BASE: ${{ secrets.CODEXRM_RELEASE_UPDATE_BASE }}
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          server="$RUNNER_TEMP/codexrm-linux-amd64-server"
          mkdir -p "$server"
          go build -trimpath -ldflags "-s -w" -o "$server/codexrm-server" ./cmd/codexrm-server
          git archive HEAD web | tar -x -C "$server"
          rm -f "$server/web/app.test.mjs" "$server/web/sw.test.mjs"
          cp LICENSE "$server/"
          install -m 0755 build/scripts/install-server.sh "$server/install-server.sh"
          install -d "$server/deploy"
          install -m 0644 deploy/codexrm.service deploy/nginx-location.conf "$server/deploy/"
          # Older commits can still be selected for a Nightly; package the updater when present.
          if [[ -d cmd/codexrm-server-updater ]]; then
            go build -trimpath -ldflags "-s -w -X github.com/codexrm/codexrm/internal/release.updateBaseURL=${CODEXRM_RELEASE_UPDATE_BASE%/}" -o "$server/codexrm-server-updater" ./cmd/codexrm-server-updater
            grep -aFq -- "${CODEXRM_RELEASE_UPDATE_BASE%/}" "$server/codexrm-server-updater" || { echo '::error::Release update origin is missing from the Server updater.'; exit 1; }
            install -m 0644 deploy/codexrm-server-update.{service,timer,env.example} "$server/deploy/"
          fi
          tar -czf "nightly-dist/CodexRM-$TAG-linux-amd64-server.tar.gz" -C "$server" .

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.TAG }}-linux
          path: nightly-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [select-commit, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.select-commit.outputs.tag }}
      SOURCE_SHA: ${{ needs.select-commit.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ env.TAG }}-*
          merge-multiple: true
          path: nightly-dist/

      - name: Publish GitHub prerelease
        working-directory: nightly-dist
        run: |
          assets=(
            "CodexRM-$TAG-windows-amd64-Setup.exe"
            "CodexRM-$TAG-linux-amd64-agent.tar.gz"
            "CodexRM-$TAG-linux-arm64-agent.tar.gz"
            "CodexRM-$TAG-linux-amd64-server.tar.gz"
          )
          notes="Build from commit $SOURCE_SHA. The Windows Agent setup includes the files needed for offline installation."
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          if existing=$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv'); then
            read -r draft target <<< "$existing"
            if [[ "$draft" != true ]]; then
              echo "Nightly $TAG is already published."
              exit 0
            fi
            [[ "$target" == "$SOURCE_SHA" ]]
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false --prerelease --latest=false --notes "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --target "$SOURCE_SHA" --title "$TAG" \
              --prerelease --latest=false --notes "$notes"
          fi
